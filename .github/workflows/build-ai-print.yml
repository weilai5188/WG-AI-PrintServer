name: Build WG AI Print P1
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 LCD 240x240
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/release.py bread-compact-wifi-lcd --name bread-compact-wifi-lcd-240x240
          test -s build/merged-binary.bin
      - uses: actions/upload-artifact@v4
        with:
          name: WG-AI-Print-P1-240x240
          path: build/merged-binary.bin
          if-no-files-found: error
